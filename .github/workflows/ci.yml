name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check src tests tools hooks bin/annotate
      - run: uv run mypy
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code validates the marketplace and both plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --json . > report.json || true
          python3 tools/check_plugin_report.py report.json
          npx -y @anthropic-ai/claude-code plugin validate --strict plugins/visual-first
